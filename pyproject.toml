[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palt-tabgen"
version = "1.0.0"
description = "Pred-LLM replication (v1) and improved schema-constrained LLM tabular generator (v2)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.51",
  "peft>=0.13",
  "accelerate>=0.30",
  "xgboost>=2.0",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "tabulate>=0.9",
  "tqdm",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.43"]
baselines = ["sdv>=1.10"]
kaggle = ["kaggle"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["common", "v1", "v2"]
include = ["tabgen*", "predllm_v1*", "predllm_v2*"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "v1/tests", "v2/tests"]
addopts = "--import-mode=importlib -q"
markers = ["smoke: end-to-end runs that download a small LLM (deselect with -m 'not smoke')"]
