# v2 = Pred-LLM + five changes (see v2/docs/NOVELTY.md). Shared keys mean the same as in v1.

llm: distilgpt2          # any key/alias from configs/llms.yaml (1.5b, 3b, 8b, ...)
mode: auto
device: auto
serialization: raw       # N1: raw = real categories + real units | encoded = paper's MinMax/code text

data:                    # identical protocol to v1 so TSTR numbers are comparable
  test_size: 0.2
  train_size: 1.0
  gen_size: 1.0
  fit_scaler_on: full
  decimals: 2
  binarize: null
  max_rows: null
  max_value_decimals: 4  # raw serialization: decimals kept per numeric column (inferred, capped)

finetune:
  epochs: 50
  batch_size: 32
  micro_batch_size: null
  lr: 5.0e-5
  lr_lora: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  max_steps: null
  log_every: 50
  reuse: true
  perm_copies: 1         # permute_x copies of D_real per epoch (paper: 1)
  orig_copies: 1         # original-order copies (paper: 1)

loss:                    # N3: weighted value-only NLL
  target_weight: 3.0     # lambda on target value tokens (+ EOS)
  scaffold_weight: 0.0   # weight on key tokens ("age is"); decoder writes them, so 0 by default

decoding:                # N2: schema-constrained field-wise decoding
  batch_size: 64
  temperature_num: 0.7   # token-level T for digits (paper's T)
  temperature_cat: 1.0   # sequence-level T over whole categorical values (1 = exact model distribution)
  kv_cache: true         # reuse the prefix KV cache when scoring candidates
  max_score_elems: 30000000 # memory cap (logit elements) per scoring chunk

query:                   # N4: permutation-marginalised exact posterior
  permutations: 4        # R orders averaged (1 = original order only, like the paper)
  label_decode: sample   # sample | argmax
  temperature_y: 0.7     # T_y when sampling labels
  reg_aggregate: mean    # regression: mean over R draws | single

curation:                # N5
  enabled: true
  pool_factor: 1.5       # generate gamma * n rows, keep n
  sir: true
  beta: 1.0
  clip: 20.0
  folds: 5
  privacy_gate: true
  privacy_alpha: 0.01
  max_drop: 0.5

eval:
  runs: 3
  fidelity: true
  max_fidelity_rows: 5000

baselines:
  epochs: 300
