# LLM switch registry, shared by v1 and v2.
#
# Only decoder-only causal LMs that support BOTH of these are listed:
#   (a) fine-tuning through transformers.AutoModelForCausalLM, with PEFT/LoRA using target_modules="all-linear"
#   (b) byte-level BPE tokenizers (GPT-2, Qwen2.5/3, Llama-3, SmolLM2 families) whose "," is a single
#       token. v2's schema-constrained decoder relies on this. SentencePiece models (Llama-2, Mistral)
#       are intentionally NOT listed: their dummy-prefix spaces break piece-wise tokenization.
# All entries are BASE (not chat/instruct) checkpoints, because the method fine-tunes on serialized rows.
#
# mode:  full  = update every weight (the paper's setting for distilgpt2)
#        lora  = bf16 base weights + LoRA adapters
#        qlora = 4-bit NF4 base weights (bitsandbytes) + LoRA adapters
# min_vram_gb: rough minimum GPU memory to fine-tune in `mode` with micro_batch_size=4 and
#              seq_len <= 256. Use `python -m tabgen llm check --llm <alias>` to test your GPU.
# gated: true -> accept the licence on huggingface.co and run `huggingface-cli login` first.

default: distilgpt2

aliases:            # size shortcuts, e.g. `--llm 1.5b`
  tiny: tiny-gpt2
  paper: distilgpt2
  0.5b: qwen2.5-0.5b
  1b: llama3.2-1b
  1.5b: qwen2.5-1.5b
  1.7b: qwen3-1.7b
  3b: qwen2.5-3b
  4b: qwen3-4b
  7b: qwen2.5-7b
  8b: qwen3-8b

models:
  # ---- test-only (random weights, a few MB) -----------------------------------------------------
  tiny-gpt2:       {hf_id: sshleifer/tiny-gpt2, params: "0.1M", mode: full, min_vram_gb: 0, gated: false,
                    note: "Smoke tests only. Random weights; output quality is meaningless."}
  tiny-llama:      {hf_id: hf-internal-testing/tiny-random-LlamaForCausalLM, params: "1M", mode: lora,
                    min_vram_gb: 0, gated: false, note: "Smoke-tests the LoRA path on a Llama-style model."}
  # ---- paper-scale (full fine-tuning, CPU possible) ------------------------------------------------
  distilgpt2:      {hf_id: distilbert/distilgpt2, params: "82M", mode: full, min_vram_gb: 2, gated: false,
                    note: "The paper's backbone (distilled GPT-2), batch 32, 50 epochs."}
  gpt2:            {hf_id: openai-community/gpt2, params: "124M", mode: full, min_vram_gb: 3, gated: false}
  gpt2-medium:     {hf_id: openai-community/gpt2-medium, params: "355M", mode: full, min_vram_gb: 6, gated: false}
  smollm2-360m:    {hf_id: HuggingFaceTB/SmolLM2-360M, params: "360M", mode: full, min_vram_gb: 6, gated: false}
  # ---- small modern LLMs (LoRA) ------------------------------------------------------------------
  qwen2.5-0.5b:    {hf_id: Qwen/Qwen2.5-0.5B, params: "0.5B", mode: lora, min_vram_gb: 3, gated: false}
  qwen3-0.6b:      {hf_id: Qwen/Qwen3-0.6B-Base, params: "0.6B", mode: lora, min_vram_gb: 3, gated: false}
  llama3.2-1b:     {hf_id: meta-llama/Llama-3.2-1B, params: "1.2B", mode: lora, min_vram_gb: 4, gated: true}
  qwen2.5-1.5b:    {hf_id: Qwen/Qwen2.5-1.5B, params: "1.5B", mode: lora, min_vram_gb: 5, gated: false}
  qwen3-1.7b:      {hf_id: Qwen/Qwen3-1.7B-Base, params: "1.7B", mode: lora, min_vram_gb: 6, gated: false}
  smollm2-1.7b:    {hf_id: HuggingFaceTB/SmolLM2-1.7B, params: "1.7B", mode: lora, min_vram_gb: 6, gated: false}
  # ---- mid-size (QLoRA 4-bit) --------------------------------------------------------------------
  qwen2.5-3b:      {hf_id: Qwen/Qwen2.5-3B, params: "3.1B", mode: qlora, min_vram_gb: 5, gated: false}
  llama3.2-3b:     {hf_id: meta-llama/Llama-3.2-3B, params: "3.2B", mode: qlora, min_vram_gb: 5, gated: true}
  qwen3-4b:        {hf_id: Qwen/Qwen3-4B-Base, params: "4.0B", mode: qlora, min_vram_gb: 6, gated: false}
  # ---- large (QLoRA 4-bit, needs >= 10-12 GB) ----------------------------------------------------
  qwen2.5-7b:      {hf_id: Qwen/Qwen2.5-7B, params: "7.6B", mode: qlora, min_vram_gb: 10, gated: false}
  llama3.1-8b:     {hf_id: meta-llama/Llama-3.1-8B, params: "8.0B", mode: qlora, min_vram_gb: 12, gated: true}
  qwen3-8b:        {hf_id: Qwen/Qwen3-8B-Base, params: "8.2B", mode: qlora, min_vram_gb: 12, gated: false}

lora_defaults: {r: 16, alpha: 32, dropout: 0.05, target_modules: all-linear}
